<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Magic board</title>
  </head>
  <body>
    <h1>Challenge CSS 2</h1>

    <div class="board">
      <div class="column">
        <div class="icon previous"><</div>
        <div class="icon icon-left">◯</div>
        <div class="icon icon-left">◇</div>
        <div class="icon icon-left">@</div>
        <div class="icon icon-left">*</div>
        <div class="icon icon-left">◇</div>
        <div class="icon icon-left">&</div>
      </div>
      <div class="grid">
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </div>
      <div class="column">
        <div class="icon icon-right">&</div>
        <div class="icon icon-right">◇</div>
        <div class="icon icon-right">*</div>
        <div class="icon icon-right">@</div>
        <div class="icon icon-right">◇</div>
        <div class="icon icon-right">◯</div>
        <div class="icon next">></div>
      </div>
    </div>
  </body>
</html>
