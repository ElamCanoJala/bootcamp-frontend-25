<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jala credentials</title>
  </head>
  <body>
    <template id="credential-template">
      <style>
        .credential {
          width: 25%;
          height: auto;
          border: 2px solid #ccc;
          border-radius: 12px;
          font-family: sans-serif;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
          gap: 0.5rem;
          background: rgb(34, 34, 34);
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .credential img {
          max-width: 100%;
          max-height: 50%;
        }

        .top-img {
          width: 100%;
        }
        .profile-img,
        .barcode {
          width: 50%;
          object-fit: contain;
        }

        .name {
          font-size: 4rem;
          font-weight: bold;
          margin: 2rem 0;
          text-align: center;
          color: white;
        }
        .role {
          font-size: 4rem;
          color: white;
          background-color: rgb(167, 72, 72);
          width: 100%;
          text-align: center;
          padding: 2rem 0;
        }
      </style>
      <div class="credential">
        <img class="top-img" />
        <img class="profile-img" />
        <div class="name"></div>
        <div class="role"></div>
        <img class="barcode" />
      </div>
    </template>

    <credential-card
      top-img="./assets/jalasoft.png"
      profile-img="./assets/profile.webp"
      name="Kakashi"
      role="Developer"
      barcode="./assets/codeqr.png"
    >
    </credential-card>

    <script>
      class CredentialCard extends HTMLElement {
        constructor() {
          super();
          const template = document.getElementById("credential-template");
          const content = template.content.cloneNode(true);
          this.attachShadow({ mode: "open" }).appendChild(content);
        }

        connectedCallback() {
          this.shadowRoot.querySelector(".top-img").src =
            this.getAttribute("top-img") || "";
          this.shadowRoot.querySelector(".profile-img").src =
            this.getAttribute("profile-img") || "";
          this.shadowRoot.querySelector(".barcode").src =
            this.getAttribute("barcode") || "";
          this.shadowRoot.querySelector(".name").textContent =
            this.getAttribute("name") || "Nombre";
          this.shadowRoot.querySelector(".role").textContent =
            this.getAttribute("role") || "Role";
        }
      }

      customElements.define("credential-card", CredentialCard);
    </script>
  </body>
</html>
