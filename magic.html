<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./magic.css" />
    <title>Magic Card</title>
  </head>

  <body>
    <section class="card">
      <header class="card-header border">
        <p class="card-name">Undead Augur</p>
        <div class="mana-container">
          <img src="./utils/black-mana.png" alt="black-mana" class="mana" />
          <img src="./utils/black-mana.png" alt="black-mana" class="mana" />
        </div>
      </header>
      <div class="card-art-container">
        <img src="./utils/card-art.png" alt="card-art" class="border" />
      </div>
      <div class="card-header card-type border">
        <p class="card-type">Creature -- Zombie Wizard</p>
        <img
          src="./utils/expansion.png"
          alt="expansion"
          class="card-img-expansion"
        />
      </div>
      <main class="content">
        <div class="border content-inner-box">
          <p class="card-description">
            Whenever this creature or another Zombie you control dies, you draw
            a card and you lose 1 life.
          </p>
          <p class="card-phrase">
            <span>“To see past the veil of death, cross it.” </span>—The Red
            Book of Mezdrithalik
          </p>
        </div>
      </main>
      <footer class="card-footer">
        <div class="card-stats">2/2</div>
        <div class="footer-info">
          <div class="footer-number">
            <p>130</p>
            <p>U</p>
          </div>
          <div class="footer-copyright">
            <p>MIC EN Sara Winters</p>
            <p>& © 2021 Wizards of the Coast</p>
          </div>
        </div>
      </footer>
    </section>
  </body>
</html>
